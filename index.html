<style>
/* Layout: one phone-width column; pond canvas is the hero, sheets slide up from the bottom, tab bar fixed at the bottom */
:root{
  --bg:#EAF2EF; --surface:#FFFFFF; --surface-2:#F4F8F6; --ink:#17323A; --muted:#5A7077; --line:#D2E1DC;
  --koi:#E8602C; --koi-ink:#FFFFFF; --koi-soft:#FCE3D8;
  --water-top:#8ED0CF; --water-bot:#2D8796; --scrim:rgba(14,32,37,.42); --bar:rgba(255,255,255,.6); --paper:#FFFDF9;
  --good:#2E9C6A; --warn:#D48A12; --bad:#D2483C;
  --display:"Chiron GoRound TC","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1C20; --surface:#16292E; --surface-2:#1C3237; --ink:#E3EFEC; --muted:#93AEB1; --line:#28434A;
  --koi:#FF8255; --koi-ink:#1B0D06; --koi-soft:#3D2418;
  --water-top:#2B6E73; --water-bot:#0D3640; --scrim:rgba(0,0,0,.55); --bar:rgba(22,41,46,.6); --paper:#1B3035;
  --good:#4CC28C; --warn:#F0AE3C; --bad:#F06B5E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1C20; --surface:#16292E; --surface-2:#1C3237; --ink:#E3EFEC; --muted:#93AEB1; --line:#28434A;
  --koi:#FF8255; --koi-ink:#1B0D06; --koi-soft:#3D2418;
  --water-top:#2B6E73; --water-bot:#0D3640; --scrim:rgba(0,0,0,.55); --bar:rgba(22,41,46,.6); --paper:#1B3035;
  --good:#4CC28C; --warn:#F0AE3C; --bad:#F06B5E; color-scheme:dark}

body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html.pond-full,html.pond-full body{height:100%;overflow:hidden}
.pond-full .app{pointer-events:none}
.pond-full .top,.pond-full #pondChips,.pond-full .pond-panel{pointer-events:auto}
.pond-full .top{background:transparent}
.pond-full .brand{flex:0 1 auto}
.pond-full .brand h1 .ttl,.pond-full .brand p{text-shadow:2px 0 0 var(--bg),-2px 0 0 var(--bg),0 2px 0 var(--bg),0 -2px 0 var(--bg),1.5px 1.5px 0 var(--bg),-1.5px 1.5px 0 var(--bg),1.5px -1.5px 0 var(--bg),-1.5px -1.5px 0 var(--bg),0 0 6px var(--bg)}
.pond-full .brand p{font-weight:700;color:var(--ink)}
.pond-full .top{justify-content:space-between}
.pond-full .who-pill,.pond-full .bell{background:var(--bar);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
#switchFarm{display:none!important}
.brand h1{white-space:nowrap;flex-wrap:nowrap}
.envpill svg{width:22px;height:22px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.25))}
.envpill{display:inline-grid;place-items:center;width:30px;height:30px;margin-left:4px;border:0;background:transparent;color:var(--ink);border-radius:50%;padding:0;font-family:var(--body);font-size:12px;font-weight:700;align-self:center;white-space:nowrap}
.pond-full #pondChips .chip,.pond-full #pondChips .chip-pen{border-color:rgba(255,255,255,.9);box-shadow:0 0 0 1px rgba(255,255,255,.9),0 2px 10px -2px rgba(0,0,0,.35)}
.pond-full #pondChips .chip[aria-selected="true"]{border-color:#FFFFFF;box-shadow:0 0 0 1.5px #FFFFFF,0 2px 10px -2px rgba(0,0,0,.4)}
.chip-sel{padding:3px 3px 3px 12px;gap:6px;border-color:var(--ink);background:var(--ink);color:var(--bg)}
.chip-sel .chip-main{display:inline-flex;align-items:center;gap:6px;border:0;background:none;color:inherit;font-size:14px;padding:3px 0}
.chip-inpen{width:28px;height:28px;border-radius:50%;border:0;background:rgba(255,255,255,.22);color:inherit;display:grid;place-items:center;padding:0}
.pond-full #pondChips .chip-sel{border-color:#FFFFFF;box-shadow:0 0 0 1.5px #FFFFFF,0 2px 10px -2px rgba(0,0,0,.4)}
.chip-pen{flex:none;width:32px;height:32px;margin-left:-4px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:grid;place-items:center;padding:0}
.chip-pen.add{font-size:18px;font-weight:700;color:var(--koi);margin-left:0}
.baitbtn.iconly{padding:3px;width:32px;height:32px;justify-content:center}
.baitbtn.iconly img{width:24px;height:24px}
.menu{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.mitem{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:14px;padding:12px 14px;font-size:15px;font-weight:500;text-align:left}
.mitem.static{background:var(--surface-2)}
.mmuted{color:var(--muted);font-size:13px;font-weight:400}
.mbadge{background:var(--koi);color:var(--koi-ink);border-radius:999px;min-width:22px;text-align:center;padding:0 7px;font-size:12px;line-height:20px}
.pond-full body::before{background:transparent}
.pond-full #pondChips{position:relative;z-index:2;padding:4px 4px 6px;margin:-4px -4px 0}
.pond-full .pond-wrap{position:fixed;inset:0;margin:0;border-radius:0;box-shadow:none;z-index:0;pointer-events:auto}
.pond-full #pond,.pond-full #pond3d{height:100%}
.pond-full .hud{top:calc(env(safe-area-inset-top,0px) + 136px);left:max(16px,env(safe-area-inset-left,0px))}
.pond-panel{margin-top:12px}
.panel-handle{display:none}
.pond-full .pond-panel{position:fixed;left:0;right:0;bottom:calc(66px + env(safe-area-inset-bottom,0px));z-index:4;max-width:560px;margin:0 auto;background:var(--bar);-webkit-backdrop-filter:blur(16px) saturate(1.4);backdrop-filter:blur(16px) saturate(1.4);border-radius:20px 20px 0 0;border:1px solid rgba(127,127,127,.18);border-bottom:0}
.pond-full .panel-handle{display:flex;width:100%;align-items:center;justify-content:center;gap:8px;border:0;background:none;padding:10px 16px;font-size:14px;font-weight:700;color:var(--ink)}
.panel-handle .chev{transition:transform .2s}
.unread-pill{display:inline-block;margin-left:6px;padding:1px 8px;border-radius:999px;background:#E8602C;color:#fff;font-size:12px;font-weight:700;line-height:18px}
.pond-panel.open .chev{transform:rotate(180deg)}
.pond-full .panel-body{display:none;max-height:min(56vh,480px);overflow-y:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 16px}
.pond-full .pond-panel.open .panel-body{display:block}
.pond-full .panel-body .roster{margin-top:0}
.dex-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:8px 0 10px}
.dex-head h2{margin:0}
.hero-fish{touch-action:pan-y}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--koi);outline-offset:2px}

.app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 104px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding-block:12px 10px}
.brand{flex:1;min-width:0}
.brand h1{font-family:var(--display);font-size:24px;line-height:1.1;margin:0;letter-spacing:.02em}
.brand p{margin:2px 0 0;font-size:12px;color:var(--muted)}
.who{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.who label{font-size:11px;color:var(--muted);letter-spacing:.06em}
.who select{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 10px;font-size:13px;max-width:150px}
.bell{position:relative;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.bell svg{width:20px;height:20px}
.bell b{position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:var(--koi);color:var(--koi-ink);font-size:11px;line-height:18px;text-align:center}

h2.sec{font-family:var(--display);font-size:18px;margin:22px 0 10px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px}
.chip[aria-selected="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}

.pond-wrap{position:relative;margin-top:10px;border-radius:22px;overflow:hidden;box-shadow:0 10px 30px -18px rgba(10,40,48,.6)}
#pond{display:block;width:100%;height:330px;touch-action:manipulation;cursor:pointer}
html{-webkit-tap-highlight-color:transparent;touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body,button,a,label,input,select,textarea{touch-action:manipulation}
input,select,textarea{font-size:16px!important}
*{-webkit-tap-highlight-color:transparent}
#pond,#pond3d,#pond3d canvas{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;outline:none}
#pond3d{position:relative;width:100%;height:400px;touch-action:none;cursor:grab}
#pond3d:active{cursor:grabbing}
#pond3d canvas{display:block;width:100%!important;height:100%!important}
.labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;left:0;top:0;display:flex;flex-direction:column;align-items:center;gap:3px;white-space:nowrap;will-change:transform}
.lbl .n{background:rgba(255,255,255,.88);color:#17323A;font-size:12px;font-weight:500;border-radius:9px;padding:1px 8px}
.lbl .b{background:#fff;color:#17323A;font-size:12px;border-radius:11px;padding:2px 9px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.lbl .evo{background:#fff;color:#E8602C;font-weight:700;font-size:11px;border-radius:6px;padding:0 6px}
.fxh{position:absolute;color:#FF5C8A;font-weight:700;font-size:20px;transform:translate(-50%,-50%);animation:fxh 1s ease-out forwards}
@keyframes fxh{to{transform:translate(-50%,-260%);opacity:0}}
.hud{pointer-events:none}
.pokecard{position:absolute;left:0;top:0;z-index:5;pointer-events:auto;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:500;box-shadow:0 6px 18px -8px rgba(0,0,0,.35);white-space:nowrap;animation:pop .25s ease-out}
.pokecard b{color:var(--koi)}
@keyframes pop{from{opacity:0;transform:scale(.8)}}
.hud .seg{pointer-events:auto}
.baitbtn{pointer-events:auto;display:inline-flex;align-items:center;gap:4px;border:0;background:rgba(255,255,255,.92);color:#17323A;border-radius:999px;padding:2px 10px 2px 4px;font-size:12px;font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.baitbtn img{width:20px;height:20px}
.envsum{display:flex;align-items:center;gap:12px;margin-top:6px}
.envbig{font-family:var(--display);font-size:22px}
.hud{flex-wrap:wrap;right:12px}
.penbtn{pointer-events:auto;width:28px;height:28px;border-radius:50%;border:0;background:rgba(255,255,255,.92);color:#17323A;display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.12);padding:0}
.hud .baitbtn span{background:none;padding:0;border-radius:0}
.bimg{width:44px;height:44px;display:block}
.hud{align-items:center}
.seg.mini{display:inline-flex;gap:2px;padding:3px;border-radius:999px;border:1px solid var(--line);background:var(--surface);overflow:visible;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.seg.mini button{flex:none;border:0;border-radius:999px;padding:3px 12px;font-size:12px;font-weight:700;background:transparent;color:var(--muted)}
.seg.mini button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.hero-wrap{position:relative}
.book{position:relative;perspective:1800px;margin-top:12px}
.book::before,.book::after{content:"";position:absolute;inset:0;border-radius:6px 18px 18px 6px;background:var(--paper);border:1px solid var(--line)}
.book::before{transform:translate(6px,6px)}.book::after{transform:translate(3px,3px)}
.page{position:relative;z-index:1;background:var(--paper);border:1px solid var(--line);border-radius:6px 18px 18px 6px;padding:16px 18px 18px 26px;box-shadow:inset 14px 0 16px -14px rgba(0,0,0,.35),0 12px 28px -18px rgba(10,40,48,.55);transform-origin:left center;-webkit-backface-visibility:hidden;backface-visibility:hidden;touch-action:pan-y}
.page.flip{position:absolute;inset:0;z-index:3;overflow:hidden}
.turn-next{animation:turnNext .7s cubic-bezier(.45,.05,.3,1) forwards}
.turn-prev{animation:turnPrev .7s cubic-bezier(.45,.05,.3,1) forwards}
@keyframes turnNext{from{transform:rotateY(0)}to{transform:rotateY(-178deg)}}
@keyframes turnPrev{from{transform:rotateY(-178deg)}to{transform:rotateY(0)}}
.page .shade{position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(90deg,rgba(0,0,0,.28),rgba(0,0,0,0) 55%);opacity:0;animation:shade .7s forwards}
@keyframes shade{50%{opacity:1}100%{opacity:0}}
.pg-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cf-row{display:flex;gap:6px;align-items:center;margin-bottom:6px}.cf-row .cf-k{flex:0 0 34%}.cf-row .cf-v{flex:1;min-width:0}
.cf-del{flex:none;width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--muted)}
.cf-presets{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}.cf-presets .chip{padding:4px 10px;font-size:13px}
.adm-hero{display:flex;align-items:center;gap:12px;margin:8px 0 4px}.adm-av{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#FFE29A,#F2B632);display:grid;place-items:center;font-size:28px;flex:none;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.adm-av.photo,.av.photo{padding:0;overflow:hidden;background:var(--surface-2)}.adm-av.photo img,.av.photo img{width:100%;height:100%;object-fit:cover;display:block}
.av.admin{font-size:18px}
.av-pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px}
.av-opt{height:44px;border-radius:50%;border:2px solid var(--line);background:var(--surface);font-size:22px;display:grid;place-items:center;cursor:pointer;overflow:hidden;padding:0}
.av-opt[aria-pressed="true"]{border-color:var(--koi);box-shadow:0 0 0 2px color-mix(in srgb,var(--koi) 30%,transparent)}
.av-opt img{width:100%;height:100%;object-fit:cover}
.adm-name{font-family:var(--display);font-size:22px;font-weight:700}.adm-sub{font-size:13px;color:var(--muted)}
.lb{display:flex;flex-direction:column;gap:6px}
.lb-row{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px 10px;color:var(--ink)}
.lb-rank{width:26px;text-align:center;font-size:20px;flex:none}.lb-n{font-family:var(--display);font-size:15px;color:var(--muted)}
.lb-fish{width:44px;height:30px;flex:none}
.lb-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}.lb-name{font-weight:700;font-size:14px;display:flex;align-items:center;gap:6px}
.lb-ponds{display:inline-flex;gap:3px}.lb-ponds .dot{width:8px;height:8px}
.lb-bar{height:6px;border-radius:999px;background:var(--surface-2);overflow:hidden}.lb-bar i{display:block;height:100%;border-radius:999px}
.lb-cnt{flex:none;font-size:12px;color:var(--muted)}.lb-cnt b{font-family:var(--display);font-size:18px;color:var(--ink)}
.inv-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:10px 0 4px}
.mem-x{display:block;margin:-4px 0 10px auto;background:none;border:0;color:var(--muted);font-size:12px;text-decoration:underline;padding:2px 6px}
.bk-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.release{margin-top:22px;padding-top:14px;border-top:1px dashed var(--line)}
.ribbons{display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.ribbon{color:#fff;font-size:12px;font-weight:700;padding:3px 12px 3px 10px;border-radius:0 999px 999px 0;margin-left:-26px}
.chip[data-fishpond][aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);font-weight:700}
.chip[data-fishpond][aria-pressed="false"]{opacity:.65}
.pgno{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--muted);letter-spacing:.06em;font-variant-numeric:tabular-nums}
.pg-art{position:relative;border-radius:16px;background:linear-gradient(var(--water-top),var(--water-bot));overflow:hidden}
.pg-art .bookcv{display:block;width:100%;height:180px;object-fit:cover}
.pg-name{display:flex;align-items:center;gap:8px;margin-top:14px}
.pg-name h3{margin:0;font-family:var(--display);font-size:26px}
.pg-meta{font-size:13px;color:var(--muted);margin-top:2px}
.pg-sat{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;margin-top:12px;font-size:13px}
.pg-sat .bar{margin:0;height:8px}
.pg-prof{border-top:1px dashed var(--line);padding-top:12px;margin-top:14px}
.pg-foot{display:flex;align-items:center;justify-content:space-between;margin-top:16px}
.curl{position:absolute;left:0;top:0;width:100%;z-index:4;transform-style:preserve-3d;pointer-events:none}
.strip{position:absolute;top:0;transform-origin:center center;transform-style:preserve-3d;will-change:transform}
.strip>.face{position:absolute;inset:0;overflow:hidden;-webkit-backface-visibility:hidden;backface-visibility:hidden}
.strip>.back{position:absolute;inset:0;background:linear-gradient(180deg,var(--paper),var(--surface-2));transform:rotateY(180deg);-webkit-backface-visibility:hidden;backface-visibility:hidden;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.cshade{position:absolute;inset:0;background:#000;pointer-events:none;opacity:0}
.cast{position:absolute;inset:0;z-index:3;border-radius:6px 18px 18px 6px;pointer-events:none;opacity:0}
#view-dex{touch-action:pan-y;user-select:none;-webkit-user-select:none}
.spin-hint{font-size:12px;color:var(--muted);text-align:center;margin:-6px 0 10px}
.wtabs{margin:4px 0 6px}
.cpick{display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px}
.sv-wrap canvas{display:block;width:100%;height:150px;border-radius:10px;touch-action:none;cursor:crosshair}
.hue-wrap canvas{display:block;width:100%;height:22px;border-radius:11px;touch-action:none;cursor:ew-resize}
.cprev{width:36px;height:36px;border-radius:10px;flex:none;border:1px solid var(--line)}
#hexIn{font-family:ui-monospace,Menlo,monospace;text-transform:uppercase;letter-spacing:.04em}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

function saveEvent(id){

  const via={};[...document.querySelectorAll('input[name=fPpl]:checked')].forEach(i=>{(via[i.value]=via[i.value]||[]).includes(i.dataset.pp)||via[i.value].push(i.dataset.pp)});const ppl=Object.keys(via);
  const err=$('fErr');
  if(!title){err.textContent='請填寫要做什麼。';err.hidden=false;return}
  if(!date){err.textContent='請選日期。';err.hidden=false;return}
  if(multi&&!endDate){err.textContent='請選回來的日期。';err.hidden=false;return}
  if(multi&&endDate<date){err.textContent='回來日期不能早於出發日期。';err.hidden=false;return}
  let e;
  if(id){e=D.events.find(x=>x.id===id);const added=ppl.filter(p=>!e.ppl.includes(p));Object.assign(e,{title,date,time,loc,ppl,via,allDay,endDate:multi&&endDate>date?endDate:'',endTime:multi&&endDate>date?endTime:''});Object.keys(e.rsvp).forEach(k=>{if(!ppl.includes(k))delete e.rsvp[k]});
    ppl.forEach(p=>notify(p,added.includes(p)?`與塘主有約：${title}，${whenText(e)}`:`行程有更新：${title}，${whenText(e)}`))}
  else{e={id:'e'+Date.now(),title,date,time,loc,ppl,via,rsvp:{},done:false,allDay,endDate:multi&&endDate>date?endDate:'',endTime:multi&&endDate>date?endTime:''};D.events.push(e);ppl.forEach(p=>notify(p,`與塘主有約：${title}，${whenText(e)}`))}

}
function completeEvent(id){

}

  if(Array.isArray(l)&&Array.isArray(r)){const key=o=>o&&typeof o==='object'?(o.id!=null?'i'+o.id:(o.at?'m'+(o.by||'')+o.at:null)):null;
    if(l.every(key)&&r.every(key)){const bm=new Map((Array.isArray(b)?b:[]).filter(key).map(o=>[key(o),o])),lm=new Map(l.map(o=>[key(o),o])),rm=new Map(r.map(o=>[key(o),o])),out=[],seen=new Set();
      const add=k=>{if(seen.has(k))return;seen.add(k);const bo=bm.get(k),lo=lm.get(k),ro=rm.get(k);
        if(lo&&ro)out.push(merge3(bo,lo,ro));else if(lo){if(!bo||JS(bo)!==JS(lo))out.push(lo)}else if(ro){if(!bo||JS(bo)!==JS(ro))out.push(ro)}};
      l.forEach(o=>add(key(o)));r.forEach(o=>add(key(o)));return out}
    return l}
  if(l&&r&&typeof l==='object'&&typeof r==='object'){const bb=b&&typeof b==='object'?b:{},o={};
    new Set([...Object.keys(l),...Object.keys(r)]).forEach(k=>{
      if(!(k in l)){if(k in bb&&JS(bb[k])===JS(r[k]))return;o[k]=r[k];return}
      if(!(k in r)){if(k in bb&&JS(bb[k])===JS(l[k]))return;o[k]=l[k];return}
      o[k]=merge3(bb[k],l[k],r[k])});return o}
  return l}
const farmData=f=>{const c=JSON.parse(JSON.stringify(f));delete c.viewer;delete c._shared;delete c._owner;return c};
const Shared={base:{},subs:{},timer:null,started:false,pending:'',
  loadBase(){try{this.base=JSON.parse(localStorage.getItem('feedwho-shared-base'))||{}}catch(e){this.base={}}},
  saveBase(){try{localStorage.setItem('feedwho-shared-base',JSON.stringify(this.base))}catch(e){}},
  ok(){return Cloud.state==='ready'&&Cloud.user&&Cloud.db},
  fref(id){return Cloud.db.collection('feedwho_farms').doc(id)},
  cref(code){return Cloud.db.collection('feedwho_codes').doc(code)},
  uniqueId(){return 'f'+Cloud.user.uid.slice(0,8).toLowerCase()+Date.now().toString(36)},
  renameFarm(oldId,newId){const f=R.farms[oldId];if(!f)return;f.id=newId;R.farms[newId]=f;delete R.farms[oldId];R.joined.forEach(m=>{if(m.farm===oldId)m.farm=newId});if(R.cur&&R.cur.farm===oldId)R.cur.farm=newId},
  async start(){if(!this.ok())return;this.loadBase();this.started=true;const uid=Cloud.user.uid;
    for(const m of R.joined.filter(m=>m.viewer==='admin')){let f=R.farms[m.farm];if(!f)continue;
      if(f._owner&&f._owner!==uid)continue;
      if(!f._shared){if(!/^f[a-z0-9]{8}[a-z0-9]+$/.test(f.id)){const nid=this.uniqueId();this.renameFarm(f.id,nid);f=R.farms[nid]}
        try{await this.fref(f.id).set({owner:uid,name:f.name,data:JS(farmData(f)),updatedAt:Date.now()});f._shared=true;f._owner=uid;this.base[f.id]=farmData(f);this.saveBase();await this.syncCodes(f,[]);save()}catch(e){Cloud.syncError(e);continue}}}
    R.joined.forEach(m=>{const f=R.farms[m.farm];if(f&&f._shared)this.listen(f.id)});
    if(this.pending){const c=this.pending;this.pending='';this.join(c)}},
  listen(id){if(this.subs[id])return;this.subs[id]=this.fref(id).onSnapshot(s=>{if(!s.exists)return;let rd;try{rd=JSON.parse(s.data().data)}catch(e){return}this.applyRemote(id,rd)},e=>console.warn('[Shared]',id,e.code))},
  applyRemote(id,rd){const lf=R.farms[id];if(!lf){R.farms[id]=Object.assign(JSON.parse(JS(rd)),{_shared:true});this.base[id]=farmData(rd);this.saveBase();return}
    const local=farmData(lf),base=this.base[id]||rd,merged=merge3(base,local,rd);

    if(JS(merged)===JS(local))return;

    try{localStorage.setItem(KEY,JSON.stringify(R))}catch(e){}
    if(JS(merged)!==JS(rd))this.schedule();
    if(D===lf){try{renderAll()}catch(e){}}},
  schedule(){if(!this.ok()||!this.started)return;clearTimeout(this.timer);this.timer=setTimeout(()=>this.pushAll(),1500)},
  dbg(){return {started:this.started,ok:this.ok(),base:Object.keys(this.base),timer:!!this.timer}},
  async pushAll(){for(const m of R.joined){const f=R.farms[m.farm];if(f&&f._shared)await this.push(f.id)}},
  async push(id){const lf=R.farms[id];if(!lf||!this.ok())return;const local=farmData(lf),base=this.base[id];if(base&&JS(base)===JS(local))return;
    try{let out;await Cloud.db.runTransaction(async tx=>{const s=await tx.get(this.fref(id));const rd=s.exists?JSON.parse(s.data().data):base||local;out=merge3(base||rd,local,rd);tx.update(this.fref(id),{data:JS(out),name:out.name||'',updatedAt:Date.now()})});
      const prevCodes=(base&&base.fish||[]).map(f=>f.code);this.base[id]=JSON.parse(JS(out));this.saveBase();
      if(JS(out)!==JS(local)){const keep={viewer:lf.viewer,_shared:true,_owner:lf._owner};Object.keys(lf).forEach(k=>delete lf[k]);Object.assign(lf,JSON.parse(JS(out)),keep);if(D===lf)renderAll()}
      if(lf._owner===Cloud.user.uid)await this.syncCodes(lf,prevCodes)}catch(e){Cloud.syncError(e)}},
  async syncCodes(f,prevCodes){const now=f.fish.map(x=>x.code);let changed=false;
    for(const fish of f.fish){if(prevCodes.includes(fish.code))continue;
      for(let tries=0;tries<3;tries++){try{await this.cref(fish.code).set({farm:f.id,fish:fish.id});break}catch(e){if(e.code==='permission-denied'){fish.code=makeCode(fish.name);changed=true}else{console.warn(e);break}}}}

    if(changed){save()}},
  async join(raw){const code=raw.trim().toUpperCase();if(!code)return;
    if(Cloud.state!=='ready'){homeErr('雲端連線中，稍等幾秒再按一次「加入魚塘」。');this.pending=code;return}
    if(!Cloud.user){this.pending=code;showView('home');$('joinCode').value=code;homeErr('要先用 Google 登入，才能加入塘主的魚塘。登入後會自動加入。');Cloud.google();return}
    try{toast('找魚塘中…');const cs=await this.cref(code).get();if(!cs.exists){homeErr('找不到這個邀請碼，請跟塘主確認一下。');return}
      const {farm,fish}=cs.data();await this.fref(farm).collection('members').doc(Cloud.user.uid).set({fish,code,at:Date.now(),name:Cloud.user.displayName||''});
      const fs=await this.fref(farm).get();if(!fs.exists){homeErr('這個魚塘已經不存在了。');return}

      let i=R.joined.findIndex(m=>m.farm===farm&&m.viewer===fish);if(i<0){R.joined.push({farm,viewer:fish});i=R.joined.length-1}

    catch(e){if(e.code==='permission-denied')homeErr('加入失敗：邀請碼不對，或塘主的雲端規則還沒更新。');else homeErr('加入失敗：'+(e.code||e.message))}}
};
